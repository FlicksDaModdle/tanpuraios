name: Build TanpuraSwiftUI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pin to an Xcode version that ships the iOS 26 SDK (needed for
      # Liquid Glass APIs like .glassEffect()). Adjust the version string
      # once you confirm what's available on the runner image — list
      # options with: ls /Applications | grep Xcode
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Simulator, unsigned)
        run: |
          xcodebuild \
            -project TanpuraSwiftUI.xcodeproj \
            -scheme TanpuraSwiftUI \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      # This .app is a Simulator build — it can't be installed on a real
      # iPhone (wrong architecture, unsigned), but downloading it confirms
      # the build succeeded and lets you inspect what got compiled. To
      # actually run the app without a Mac, see the TestFlight path in
      # release.yml / README.md.
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: TanpuraSwiftUI-simulator-build
          path: build/Build/Products/Debug-iphonesimulator/TanpuraSwiftUI.app
          if-no-files-found: error

      # --- Real-device / TestFlight build ---
      # Uncomment and configure once you have an Apple Developer account.
      # Store your certificate (.p12), provisioning profile, and their
      # passwords as GitHub Secrets, then import them here before building
      # with -destination "generic/platform=iOS" and `archive` instead of
      # `build`. See: https://docs.github.com/actions/deployment/deploying-xcode-applications
      #
      # - name: Import signing certificate
      #   uses: apple-actions/import-codesign-certs@v3
      #   with:
      #     p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      #     p12-password: ${{ secrets.P12_PASSWORD }}
