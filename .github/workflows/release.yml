name: Release to TestFlight

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: "How to sign/export the IPA"
        type: choice
        default: unsigned
        options:
          - unsigned # no cert/keychain needed at all — Sideloadly/AltStore sign it locally with your free Apple ID at install time
          - ad-hoc # your own Apple Developer cert; installs on devices you've registered by UDID
          - enterprise # third-party in-house distribution cert; no UDID registration needed
          - app-store-connect # uploads to TestFlight; install via the TestFlight app

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # --- Cert-based paths only (skipped entirely for "unsigned") ---
      - name: Import signing certificate
        if: github.event.inputs.export_method != 'unsigned'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s build.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Install provisioning profile
        if: github.event.inputs.export_method != 'unsigned'
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > profile.mobileprovision
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Archive (signed)
        if: github.event.inputs.export_method != 'unsigned'
        run: |
          xcodebuild \
            -project TanpuraSwiftUI.xcodeproj \
            -scheme TanpuraSwiftUI \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -archivePath build/Tanpura.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            archive

      - name: Write export options
        if: github.event.inputs.export_method != 'unsigned'
        run: |
          cat > ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>${{ github.event.inputs.export_method }}</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
              <key>signingStyle</key>
              <string>manual</string>
          </dict>
          </plist>
          EOF

      - name: Export IPA (signed)
        if: github.event.inputs.export_method != 'unsigned'
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Tanpura.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist

      # --- Unsigned path: build for a real device, no signing at all ---
      # This produces a plain .app built for arm64 iOS (not the Simulator),
      # with no code signature attached. iOS itself won't run an unsigned
      # binary, so this alone isn't installable — but Sideloadly/AltStore
      # take exactly this kind of unsigned bundle and sign it themselves
      # locally with your Apple ID when you install it, which is their
      # normal, intended workflow (not a hack).
      - name: Build (unsigned, device)
        if: github.event.inputs.export_method == 'unsigned'
        run: |
          xcodebuild \
            -project TanpuraSwiftUI.xcodeproj \
            -scheme TanpuraSwiftUI \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # An .ipa is just a zip of a specific folder layout: Payload/App.app.
      # We build that structure by hand since there's no archive/export step
      # to do it for us in the unsigned path.
      - name: Package unsigned IPA
        if: github.event.inputs.export_method == 'unsigned'
        run: |
          mkdir -p build/export/Payload
          cp -r build/Build/Products/Release-iphoneos/TanpuraSwiftUI.app build/export/Payload/
          cd build/export
          zip -r -q TanpuraSwiftUI.ipa Payload
          rm -rf Payload

      # Always available regardless of export method — download this from
      # the workflow run's "Artifacts" section.
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TanpuraSwiftUI-${{ github.event.inputs.export_method }}
          path: build/export/*.ipa
          if-no-files-found: error

      # --- Upload to TestFlight (app-store-connect method only) ---
      - name: Upload to TestFlight
        if: github.event.inputs.export_method == 'app-store-connect'
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo "$APPSTORE_PRIVATE_KEY" > ~/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8
          xcrun altool --upload-app \
            --type ios \
            --file build/export/TanpuraSwiftUI.ipa \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"
